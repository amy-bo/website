# Deploys amybo.org to Cloudflare from GitHub. See README "Deploying from GitHub".
#
# Two jobs, so that code nobody has reviewed never runs next to a credential:
#   build   no secrets at all: installs, builds the site, uploads it as an artifact.
#   deploy  runs in the "production" GitHub Environment (add a required reviewer in the repository settings so every
#           deploy waits for a two-factor-authenticated approval), installs without running package scripts, and only
#           then uses the Cloudflare token, scoped to the steps that need it.
#
# Only the Pages project's production branch touches the live database and the cron Worker; any other branch gets a
# preview deployment of the static site. Pushing to main makes main the production branch (the one-way switch at merge).
#
# Needs GitHub Actions secret values for the API token, the account id, TOKEN_SECRET, the Resend key and the Turnstile
# secret key, and variables PUBLIC_TURNSTILE_SITE_KEY (required), SITE_URL, ACCESS_TEAM_DOMAIN and ACCESS_AUD (optional).
name: Deploy to Cloudflare

on:
  push:
    branches: [launch-2026, main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci
          # The "node" devDependency exists for the development container; CI uses setup-node's Node.
          rm -f node_modules/.bin/node
      - name: Build the site
        run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT: amybo
      DB_NAME: amybo-rsvp-eu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install wrangler without running package scripts
        run: |
          npm ci --ignore-scripts
          rm -f node_modules/.bin/node
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check the secrets and variables are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TOKEN_SECRET RESEND_API_KEY TURNSTILE_SECRET_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "Missing repository secrets:$missing"; exit 1; fi
          case "$RESEND_API_KEY" in re_*) ;; *) echo "::warning::RESEND_API_KEY is not a Resend key yet: registration will refuse sign-ups until it is." ;; esac
          [ "${#TOKEN_SECRET}" -ge 32 ] || { echo "TOKEN_SECRET must be at least 32 characters"; exit 1; }

      - name: Decide whether this branch is production
        id: prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          prod=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.production_branch // empty' || true)
          if [ -z "$prod" ]; then
            npx wrangler pages project create "$PROJECT" --production-branch "$GITHUB_REF_NAME"
            prod="$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF_NAME" = "main" ] && [ "$prod" != "main" ]; then
            # Merging to main hands production over to main, once.
            curl -fsS -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
              --data '{"production_branch":"main"}' "$api" > /dev/null
            prod=main
          fi
          echo "Production branch: $prod"
          if [ "$GITHUB_REF_NAME" = "$prod" ]; then echo "is_prod=true" >> "$GITHUB_OUTPUT"; else echo "is_prod=false" >> "$GITHUB_OUTPUT"; fi

      - name: Put the site URL and Access details in the configs (when set)
        run: |
          if [ -n "$SITE_URL" ]; then sed -i "s#^SITE_URL = .*#SITE_URL = \"$SITE_URL\"#" wrangler.toml workers/cron/wrangler.toml; fi
          if [ -n "$ACCESS_TEAM_DOMAIN" ] && [ -n "$ACCESS_AUD" ]; then
            sed -i "s/REPLACE_WITH_TEAM.cloudflareaccess.com/$ACCESS_TEAM_DOMAIN/; s/REPLACE_WITH_ACCESS_APPLICATION_AUD_TAG/$ACCESS_AUD/" wrangler.toml
          fi
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}

      - name: Create the EU D1 database if it does not exist, and put its id in the configs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() { npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | (.uuid // .id)'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            # EU jurisdiction: registrants' data is stored and processed in the EU. Cannot be changed after creation.
            npx wrangler d1 create "$DB_NAME" --jurisdiction eu
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "Could not find the D1 database id"; exit 1; }
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$id/" wrangler.toml workers/cron/wrangler.toml

      - name: Apply migrations and the event seed (production only)
        if: steps.prod.outputs.is_prod == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply "$DB_NAME" --remote
          npx wrangler d1 execute "$DB_NAME" --remote --file seed/2026-11-13-london.sql

      - name: Set the Pages secrets (production only)
        if: steps.prod.outputs.is_prod == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          V_TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          V_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          V_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          for n in TOKEN_SECRET RESEND_API_KEY TURNSTILE_SECRET_KEY; do
            v="V_$n"; printf '%s' "${!v}" | npx wrangler pages secret put "$n" --project-name "$PROJECT"
          done

      - name: Deploy the site and its Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name "$PROJECT" --branch "$GITHUB_REF_NAME" --commit-dirty=true

      - name: Deploy the cron Worker and its secrets (production only)
        if: steps.prod.outputs.is_prod == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          V_TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          V_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          npx wrangler deploy --config workers/cron/wrangler.toml
          for n in TOKEN_SECRET RESEND_API_KEY; do
            v="V_$n"; printf '%s' "${!v}" | npx wrangler secret put "$n" --config workers/cron/wrangler.toml
          done
