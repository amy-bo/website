# Companion cron Worker for amybo.org. Deploy with: npx wrangler deploy --config workers/cron/wrangler.toml
name = "amybo-cron"
main = "index.ts"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
SITE_URL = "https://amybo.org"
NOTIFY_EMAIL = "hello@amybo.org"
# As for the site: organisers who may answer poll suggestions by email (only once POLL_REPLY_EMAIL is set).
ADMIN_EMAILS = "hello@amybo.org"
EMAIL_FROM = "AMYBO <hello@amybo.org>"
ORG_NAME = "AMYBO"
ORG_FOOTER = "AMYBO is a non-profit trading name of andeye Ltd, registered in Scotland, company number SC665704."
PRIVACY_URL = "/privacy/"
EVENTSANDEYE_URL = "https://github.com/andeyePro/eventsandeye"

[[d1_databases]]
binding = "DB"
database_name = "amybo-rsvp-eu"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "../../eventsandeye/migrations"

# Secrets (set with `npx wrangler secret put <NAME> --config workers/cron/wrangler.toml`):
#   RESEND_API_KEY, TOKEN_SECRET (must match the Pages project's value)
# Optional: CF_ACCESS_API_TOKEN and CF_ACCOUNT_ID (as on the Pages project), so people are taken off a Pi's Access policy
# when their course ends, without anyone opening the admin page.
