# Companion cron Worker for amybo.org. Deploy with: npx wrangler deploy --config workers/cron/wrangler.toml
name = "amybo-cron"
main = "index.ts"
compatibility_date = "2026-05-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
SITE_URL = "https://amybo.org"
NOTIFY_EMAIL = "hello@amybo.org"
EMAIL_FROM = "AMYBO <hello@amybo.org>"

[[d1_databases]]
binding = "DB"
database_name = "amybo-rsvp"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "../../migrations"

# Secrets (set with `npx wrangler secret put <NAME> --config workers/cron/wrangler.toml`):
#   RESEND_API_KEY, TOKEN_SECRET (must match the Pages project's value)
