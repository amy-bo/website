# Cloudflare Pages project for amybo.org (static Astro build + Pages Functions in ./functions).
name = "amybo"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

[vars]
SITE_URL = "https://amybo.org"
NOTIFY_EMAIL = "hello@amybo.org"
EMAIL_FROM = "AMYBO <hello@amybo.org>"
ORG_NAME = "AMYBO"
ORG_FOOTER = "AMYBO is a non-profit trading name of andeye Ltd, registered in Scotland, company number SC665704."
PRIVACY_URL = "/privacy/"
EVENTSANDEYE_URL = "https://github.com/andeyePro/eventsandeye"
# Cloudflare Access application for /admin/* and /api/admin/* (see README):
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_TEAM.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD_TAG"
# Only these Access identities may use the admin page, whatever the Access policy says (comma-separated).
ADMIN_EMAILS = "hello@amybo.org"
# The "AMYBO admin" Access application requires an authenticator app itself (Authentication → MFA → Customize).
# Its tokens don't report that, so the code relies on the application's setting. Keep that setting on.
ACCESS_MFA = "application"
# Name badges on the admin page (Events&I): the Avery 4822 holders' 90 × 60 mm inserts, AMYBO's logo in the top corner
# with EVENT'26 under it, names in Montserrat SemiBold, affiliations in AMYBO blue, the dots on i and j in AMYBO green.
BADGE_TEMPLATE = "avery-4822"
BADGE_LOGO_URL = "/badges/amybo-logo-black.svg"
BADGE_LOGO_POSITION = "corner"
BADGE_TAG = "EVENT’26"
BADGE_TAG_COLOUR = "#007CBB"
BADGE_TAG_WIDTH = "0.64"
BADGE_FONT_URL = "/fonts/Montserrat-SemiBold.woff2"
BADGE_FONT_FAMILY = "Montserrat SemiBold"
BADGE_COLOUR = "#000000"
BADGE_AFFILIATION_COLOUR = "#007CBB"
BADGE_ACCENT_COLOUR = "#87BD25"

[[d1_databases]]
binding = "DB"
database_name = "amybo-rsvp-eu"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "eventsandeye/migrations"

# Secrets (Pages project > Settings > Variables and secrets, or `npx wrangler pages secret put <NAME>`):
#   RESEND_API_KEY, TOKEN_SECRET, TURNSTILE_SECRET_KEY
# Local development values live in .dev.vars (gitignored); copy .dev.vars.example.
